<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#10251f">
  <meta name="description" content="Bottle Sort – ein farbenfrohes Sortierspiel">
  <link rel="manifest" href="./manifest.json">
  <link rel="stylesheet" href="./style.css">
  <title>Bottle Sort</title>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand"><span class="brand-mark" aria-hidden="true">◒</span><div><strong>BOTTLE SORT</strong><small>FOCUS • FLOW • FINISH</small></div></div>
      <div class="stats" aria-live="polite"><span id="levelLabel">Level 1</span><span class="moves"><b id="moveCount">0</b> Züge</span></div>
    </header>
    <main>
      <section class="hero"><p class="eyebrow">LIQUID LOGIC</p><h1>Finde den<br><em>klaren Fluss.</em></h1><p class="intro">Sortiere jede Farbe in eine eigene Flasche. Oben anklicken, dann ins Ziel gießen.</p></section>
      <section class="controls" aria-label="Spieleinstellungen">
        <label>Schwierigkeit<select id="difficulty"><option value="4">Einfach · 4 Farben</option><option value="6" selected>Mittel · 6 Farben</option><option value="8">Schwer · 8 Farben</option><option value="12">Extrem · 12 Farben</option><option value="custom">Benutzerdefiniert</option></select></label>
        <label id="customWrap" class="hidden">Farben<input id="customColors" type="number" min="2" max="20" value="6"></label>
        <label>Zeilen<select id="rowsSelect"></select></label><label>Spalten<select id="colsSelect"></select></label>
        <button id="newGame" class="primary" type="button">Neues Spiel <span aria-hidden="true">↗</span></button><button id="undo" class="secondary" type="button" disabled>↶ Undo</button>
      </section>
      <p id="hint" class="hint" aria-live="polite">Wähle eine Quellflasche.</p>
      <section id="board" class="board" aria-label="Spielfeld"></section>
    </main>
    <footer><span>© BOTTLE SORT</span><span>PUZZLE NO. <b id="puzzleNo">001</b></span></footer>
  </div>
  <div id="winOverlay" class="overlay hidden" role="dialog" aria-modal="true" aria-labelledby="winHeading"><canvas id="confetti" aria-hidden="true"></canvas><div class="win-card"><span class="win-kicker">PERFEKT SORTIERT</span><h2 id="winHeading">Schöner<br><em>Flow.</em></h2><p id="winText"></p><button id="playAgain" class="primary" type="button">Neue Runde ↗</button></div></div>
  <script src="./app.js" defer></script>
<script type="module" src="https://static.cloudflareinsights.com/beacon.min.js/v4513226cdae34746b4dedf0b4dfa099e1781791509496" integrity="sha512-ZE9pZaUXND66v380QUtch/5sE9tPFh2zg45pR2PB0CVkCtOREv2AJKkSidISWkysEuQ0EH8faUU5du78bx87UQ==" data-cf-beacon='{"version":"2024.11.0","token":"8607d2a720d14b038279025b2b5a82e5"}' crossorigin="anonymous"></script>
</body>
</html>
