<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Flaschen sortieren</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div><p class="eyebrow">WATER SORT PUZZLE</p><h1>Flaschen sortieren</h1></div>
      <div class="moves" aria-live="polite"><span>Züge</span><strong id="move-count">0</strong></div>
    </header>
    <section class="controls" aria-label="Spieloptionen">
      <label>Zeilen<select id="rows"><option>2</option><option>3</option><option selected>4</option><option>5</option><option>6</option><option>7</option><option>8</option></select></label>
      <label>Spalten<select id="columns"><option>2</option><option>3</option><option>4</option><option selected>5</option><option>6</option><option>7</option><option>8</option></select></label>
      <label>Farben<select id="colors"><option>2</option><option>3</option><option>4</option><option>5</option><option selected>6</option><option>7</option><option>8</option><option>9</option><option>10</option><option>11</option><option>12</option></select></label><br>
      <button class="button primary" id="new-game" type="button">Neues Spiel</button><button class="button secondary" id="undo" type="button">Rückgängig</button>
    </section>
    <section class="game-card"><div class="board" id="board" role="grid"></div></section>
  </main>
  <div class="overlay" id="win-overlay" hidden><div class="dialog" role="dialog" aria-modal="true" aria-labelledby="win-title"><p class="eyebrow">PUZZLE GELÖST</p><h2 id="win-title">Gewonnen!</h2><p id="win-moves"></p><button class="button primary" id="win-new" type="button">Neues Spiel</button></div></div>
  <script src="app.js"></script>
</body>
</html>
