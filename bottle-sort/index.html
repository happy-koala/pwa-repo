<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Flaschen-Sortierspiel</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#1e293b">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="stylesheet" href="./style.css">
</head>
<body>
<div id="app">
  <header>
    <h1>💧 Flaschen-Sortierspiel</h1>
    <div class="stats">
      <span id="moveCounter">Züge: 0</span>
      <span id="levelLabel">Level 1</span>
    </div>
  </header>

  <div id="difficultyBar">
    <div class="settingRow">
      <label for="difficultySelect">Schwierigkeit:</label>
      <select id="difficultySelect">
        <option value="easy">Einfach (4 Farben)</option>
        <option value="medium" selected>Mittel (6 Farben)</option>
        <option value="hard">Schwer (8 Farben)</option>
        <option value="extreme">Extrem (12 Farben)</option>
        <option value="custom">Benutzerdefiniert…</option>
      </select>
      <span id="customWrap" class="hidden">
        <input type="number" id="customColors" min="2" max="20" value="6"> Farben
      </span>
    </div>

    <div class="settingRow">
      <label for="rowsInput">Spielfeld:</label>
      <input type="number" id="rowsInput" min="1" max="10" value="0" placeholder="auto">
      <span>Zeilen ×</span>
      <input type="number" id="colsInput" min="1" max="12" value="0" placeholder="auto">
      <span>Spalten</span>
      <small id="gridHint">(0 = automatisch)</small>
    </div>
  </div>

  <div id="bottleContainer"></div>

  <div class="controls">
    <button id="newGameBtn">🔄 Neues Spiel</button>
    <button id="resetBtn">↩️ Zurücksetzen</button>
    <button id="undoBtn">⬅️ Rückgängig</button>
  </div>

  <div id="winOverlay" class="hidden">
    <div class="winBox">
      <h2>🎉 Gelöst! 🎉</h2>
      <p id="winStats"></p>
      <button id="nextLevelBtn">Nächstes Level</button>
    </div>
  </div>
</div>

<canvas id="confettiCanvas"></canvas>

<script src="./app.js"></script>
</body>
</html>
