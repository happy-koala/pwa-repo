<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#6b2a16" />
  <title>Futoshiki</title>
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <header class="app-header">
    <h1 class="app-title">Futoshiki</h1>
    <div class="controls">
      <label class="control">
        <span class="control-label">Größe</span>
        <select id="size-select" aria-label="Größe">
          <option value="4" selected>4 × 4</option>
          <option value="5">5 × 5</option>
          <option value="6">6 × 6</option>
        </select>
      </label>
      <label class="control">
        <span class="control-label">Schwierigkeit</span>
        <select id="difficulty-select" aria-label="Schwierigkeit">
          <option value="easy" selected>Leicht</option>
          <option value="medium">Mittel</option>
          <option value="hard">Schwer</option>
        </select>
      </label>
      <button id="new-btn" type="button" class="btn-primary">Neues Puzzle</button>
    </div>
    <div class="status-bar">
      <span id="status" class="status">Drücke „Neues Puzzle", um zu starten.</span>
      <span id="timer" class="timer" hidden>00:00</span>
    </div>
  </header>

  <main class="main">
    <div id="board-wrapper" class="board-wrapper">
      <div id="board" class="board" data-size="4" aria-label="Futoshiki-Brett"></div>
    </div>
    <div class="action-row">
      <button id="check-btn" type="button" class="btn-secondary">Prüfen</button>
      <button id="hint-btn" type="button" class="btn-secondary">Tipp</button>
      <button id="solve-btn" type="button" class="btn-secondary">Lösen</button>
    </div>
  </main>

  <footer class="app-footer">
    <small>🔢</small>
  </footer>

  <script type="module" src="./app.js"></script>
</body>
</html>
