<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b6b3a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Solitär">
<title>Solitär</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header>
    <a href="../" class="home-link" aria-label="Zurück zur Auswahl">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="#ffffff33" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-label="Home">
        <path d="M3 10.5 12 3l9 7.5"/>
        <path d="M5 9.5V21h14V9.5"/>
        <path d="M9 21v-6h6v6"/>
      </svg>
    </a>
    <div class="stats">
      <span>⏱ <b id="timer">00:00</b></span>
      <span>🖱 <b id="moves">0</b></span>
    </div>
    <button class="ctrl solve-btn hidden" id="solveBtn">Auflösen</button>
    <div class="btns">
      <button class="ctrl" id="undoBtn">↩︎</button>
      <button class="ctrl" id="newGameBtn">Neu</button>
    </div>
  </header>
  <div id="board">
    <div class="row top-row" id="topRow"></div>
    <div class="row tableau-row" id="tableauRow"></div>
  </div>
</div>

<div class="win-overlay" id="winOverlay">
  <h2>🎉 Gewonnen!</h2>
  <p id="winStats"></p>
  <button id="winNewGame">Neues Spiel</button>
</div>

<script src="app.js"></script>
</body>
</html>
