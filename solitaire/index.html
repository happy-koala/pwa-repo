<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b6b3a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Solitär">
<title>Solitär</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header>
    <h1>Solitär</h1>
    <div class="stats">
      <span>⏱ <b id="timer">00:00</b></span>
      <span>🖱 <b id="moves">0</b></span>
    </div>
    <div class="btns">
      <button class="ctrl" id="undoBtn">↩︎</button>
      <button class="ctrl" id="newGameBtn">Neu</button>
    </div>
  </header>
  <div id="board">
    <div class="row top-row" id="topRow"></div>
    <div class="row tableau-row" id="tableauRow"></div>
  </div>
</div>

<div class="win-overlay" id="winOverlay">
  <h2>🎉 Gewonnen!</h2>
  <p id="winStats"></p>
  <button id="winNewGame">Neues Spiel</button>
</div>

<script src="app.js"></script>
</body>
</html>
